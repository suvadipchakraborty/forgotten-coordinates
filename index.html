<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgotten Coordinates — Find your city's ghost twin</title>
<meta name="description" content="Type any city. Discover the nearest abandoned settlement, lost colony or forgotten ruin — its coordinates, distance and story.">

<link rel="manifest" href="manifest.json">

<meta property="og:site_name" content="Forgotten Coordinates">

<meta property="og:description" content="Type any city and meet the nearest abandoned settlement, lost colony or forgotten ruin.">
<meta property="og:url" content="https://forgotten-coordinates.suvadipchakraborty.workers.dev/">
<meta property="og:image" content="https://forgotten-coordinates.suvadipchakraborty.workers.dev/preview.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Forgotten Coordinates — Find your city's ghost twin">
<meta name="twitter:description" content="Type any city and meet the nearest abandoned settlement, lost colony or forgotten ruin.">
<meta name="twitter:image" content="https://forgotten-coordinates.suvadipchakraborty.workers.dev/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="masthead">
  <h1>Forgotten Coordinates</h1>
  <p class="tag">Every modern city has a ghost twin. Name yours.</p>
  <form id="form" class="finder" autocomplete="off">
    <label for="city" class="sr">City</label>
    <input id="city" type="text" placeholder="Berlin, Lagos, Osaka…" required>
    <button type="submit" id="go">Find my ghost twin</button>
  </form>
  <button id="install" class="ghost-btn" type="button">Install app</button>
</header>
<main>
  <p id="status" class="status" role="status" aria-live="polite">Enter a city to begin the search.</p>
  <section id="result" class="result" hidden>
    <div id="map" aria-label="Map of the city and its ghost twin"></div>
    <article class="card">
      <figure id="photo" class="photo" hidden><img id="img" alt=""><figcaption id="cap"></figcaption></figure>
      <h2 id="name"></h2>
      <p id="coords" class="coords"></p>
      <p id="badge" class="badge"></p>
      <h3>Historical dossier</h3>
      <p id="story" class="story"></p>
      <div class="actions">
        <button id="share" type="button">Share this find</button>
        <a id="wiki" target="_blank" rel="noopener">Read the full record</a>
      </div>
    </article>
  </section>
</main>
<footer>
  <span>Built by Suva</span>
  <a class="fb" href="mailto:suvadipchakraborty@gmail.com?subject=Forgotten%20Coordinates%20Feedback" aria-label="Send feedback" title="Send feedback">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    Feedback
  </a>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
